name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            preset: macos-debug
          - os: ubuntu-24.04
            preset: linux-debug
          - os: windows-2022
            preset: windows-debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux windowing build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang xorg-dev libx11-xcb-dev libwayland-dev wayland-protocols libxkbcommon-dev libglib2.0-dev
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Prepare Dawn and vendored assets
        shell: bash
        run: bash scripts/vendor.sh
      - name: Configure
        shell: bash
        run: |
          # Dawn fetches about 20 third-party repositories from googlesource.com while
          # configuring, and a fetch occasionally fails. Retry from a clean Dawn copy.
          for attempt in 1 2 3; do
            cmake --preset ${{ matrix.preset }} && exit 0
            echo "::warning::Configure attempt $attempt failed; retrying with a clean Dawn copy"
            rm -rf build/${{ matrix.preset }}/dawn-source
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
